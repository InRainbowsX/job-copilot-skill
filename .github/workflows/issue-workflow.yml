name: Issue 工作流

on:
  issues:
    types:
      - opened
      - edited
      - reopened
      - labeled
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      issue_number:
        description: "需要重放的 Issue 编号"
        required: true
        type: number

permissions:
  contents: read
  issues: write

jobs:
  process-issue:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'issues' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       contains(github.event.comment.body, '/run-issue-workflow'))
    steps:
      - name: 解析 Issue 上下文
        id: issue
        uses: actions/github-script@v7
        with:
          script: |
            let issue;
            if (context.eventName === "workflow_dispatch") {
              const issue_number = Number(core.getInput("issue_number"));
              const response = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
              });
              issue = response.data;
            } else {
              issue = context.payload.issue;
            }

            const labels = (issue.labels || []).map((label) =>
              typeof label === "string" ? label : label.name,
            );

            core.setOutput("number", String(issue.number));
            core.setOutput("title", issue.title);
            core.setOutput("labels", labels.join(", "));

      - name: 写入工作流提示评论
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = Number("${{ steps.issue.outputs.number }}");
            const title = "${{ steps.issue.outputs.title }}";
            const labels = "${{ steps.issue.outputs.labels }}";

            const body = [
              "Issue 工作流已触发。",
              "",
              `- 标题：${title}`,
              `- 标签：${labels || "无"}`,
              "",
              "## 建议流程",
              "",
              "1. 先补完整 Issue：背景、要做什么、别做什么、什么算完成",
              "2. 明确本次改动影响的层级",
              "3. 更新 skill、references、assets 或治理文件",
              "4. 运行 `./scripts/run_checks.sh`",
              "5. 提交 PR，并关联当前 Issue",
            ].join("\\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });
