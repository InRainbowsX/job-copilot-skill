name: Issue Workflow

on:
  issues:
    types:
      - opened
      - edited
      - reopened
      - labeled
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to replay"
        required: true
        type: number

permissions:
  contents: read
  issues: write

jobs:
  process-issue:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'issues' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       contains(github.event.comment.body, '/run-issue-workflow'))
    steps:
      - name: Resolve issue context
        id: issue
        uses: actions/github-script@v7
        with:
          script: |
            let issue;
            if (context.eventName === "workflow_dispatch") {
              const issue_number = Number(core.getInput("issue_number"));
              const response = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
              });
              issue = response.data;
            } else {
              issue = context.payload.issue;
            }

            const labels = (issue.labels || []).map((label) =>
              typeof label === "string" ? label : label.name,
            );

            core.setOutput("number", String(issue.number));
            core.setOutput("title", issue.title);
            core.setOutput("labels", labels.join(", "));

      - name: Comment workflow guidance
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = Number("${{ steps.issue.outputs.number }}");
            const title = "${{ steps.issue.outputs.title }}";
            const labels = "${{ steps.issue.outputs.labels }}";

            const body = [
              "Issue workflow triggered.",
              "",
              `- Title: ${title}`,
              `- Labels: ${labels || "none"}`,
              "",
              "## Recommended flow",
              "",
              "1. Clarify the target layer",
              "2. Update the skill, references, assets, or governance files",
              "3. Run `./scripts/run_checks.sh`",
              "4. Open a PR linked to this issue",
            ].join("\\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });
