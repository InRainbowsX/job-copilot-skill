name: 持续检查

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pr-check:
    name: PR 关联 Issue 检查
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: 检查是否关联 Issue
        uses: actions/github-script@v7
        with:
          script: |
            const { body, title } = context.payload.pull_request;
            const issuePattern = /(?:close|closes|fix|fixes|resolve|resolves)\s+#\d+/i;
            const hasIssueRef = issuePattern.test(body || '') || issuePattern.test(title || '');

            if (!hasIssueRef) {
              core.setFailed('PR 必须关联 Issue，例如：close #12');
            }

  governance:
    name: 仓库治理与 Skill 校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行仓库检查
        run: ./scripts/run_checks.sh

  summary:
    name: 汇总结果
    runs-on: ubuntu-latest
    needs: [pr-check, governance]
    if: always()
    steps:
      - run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            [[ "${{ needs.pr-check.result }}" == "success" ]] || exit 1
          fi
          [[ "${{ needs.governance.result }}" == "success" ]] || exit 1
